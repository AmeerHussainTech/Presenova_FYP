    <!-- PWA Manifest -->

    <!-- Apple PWA Meta Tags (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Presenova" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Presenova — AI Presentation & Speech Coaching Platform" />
    <meta property="og:description" content="Evaluate slide decks against the 7Cs framework, analyze vocal delivery pace, simulate academic viva defense, and refine presentations seamlessly." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Presenova — AI Presentation & Speech Coaching Platform" />
    <meta name="twitter:description" content="AI-powered multi-modal presentation coaching, slide auditing, and speech telemetry." />

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker: Auto-unregister and clear cache in development -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister().then((boolean) => {
                console.log('[SW] Unregistered development service worker:', boolean);
              });
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (const name of names) {
                caches.delete(name);
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
              .then(reg => console.log('[SW] Registered:', reg.scope))
              .catch(err => console.log('[SW] Registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
