services:
  - type: web
    name: fyp-presenova
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "gunicorn -k gthread --threads 4 -w 1 --timeout 120 --bind 0.0.0.0:$PORT main:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: "fyp-firebase-df1f6-cfc8e"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false   # Paste your Firebase service account JSON here in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: GEMINI_FALLBACK_MODELS
        value: "gemini-2.0-flash,gemini-1.5-flash"
      - key: SOCKETIO_ASYNC_MODE
        value: "threading"
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOW_IN_MEMORY_DB
        value: "true"
      - key: PREWARM_MODELS
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_GRAMMAR_CHECK
        value: "1"
      - key: LANGUAGETOOL_API_URL
        value: "https://api.languagetool.org/v2"
    healthCheckPath: /api/health

  - type: web
    name: fyp-presenova-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://presenova-backend.onrender.com/api"
      - key: VITE_SOCKET_URL
        value: "https://presenova-backend.onrender.com"
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyAMEhMCPszf1ilhrM89rIUM5zvGp3PcyhQ"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "fyp-firebase-df1f6-cfc8e.firebaseapp.com"
      - key: VITE_FIREBASE_PROJECT_ID
        value: "fyp-firebase-df1f6-cfc8e"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: "fyp-firebase-df1f6-cfc8e.firebasestorage.app"
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "44488882879"
      - key: VITE_FIREBASE_APP_ID
        value: "1:44488882879:web:e0f347ae1f8db107f0e40a"
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: "G-2V7WQ3KH4F"
